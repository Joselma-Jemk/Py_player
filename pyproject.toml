[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyplayer"
dynamic = ["version"]
description = "Lecteur vidéo/audio local minimaliste basé sur PySide6 (Qt 6)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "Licence.txt" }
authors = [{ name = "Josias KOUTCHANOU" }]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
online = ["yt-dlp>=2025.1.1"]
build = ["nuitka>=2.5", "zstandard>=0.22", "ordered-set>=4.1", "imageio>=2.34", "yt-dlp>=2025.1.1"]
dev = ["pytest>=8", "hypothesis>=6", "pytest-timeout>=2", "pytest-cov>=5", "pyflakes>=3", "yt-dlp>=2025.1.1"]

[project.scripts]
pyplayer = "pyplayer.__main__:main"

[project.gui-scripts]
pyplayer-gui = "pyplayer.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "pyplayer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyplayer = ["resources/*.ttf", "resources/icons/*.png", "resources/icons/*/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: tests longs (lecture réelle, stress)"]

[tool.coverage.run]
source = ["pyplayer"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
