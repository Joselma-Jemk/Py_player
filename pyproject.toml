[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyplayer"
dynamic = ["version"]
description = "Lecteur vidéo/audio local minimaliste basé sur PySide6 (Qt 6)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Josias KOUTCHANOU" }]
keywords = ["video", "audio", "player", "pyside6", "qt", "yt-dlp", "downloader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = ["PySide6>=6.6"]

[project.urls]
Homepage = "https://github.com/Joselma-Jemk/Py_player"
Issues = "https://github.com/Joselma-Jemk/Py_player/issues"
Changelog = "https://github.com/Joselma-Jemk/Py_player/blob/master/CHANGELOG.md"

[project.optional-dependencies]
online = ["yt-dlp>=2025.1.1"]
build = ["nuitka>=2.5", "zstandard>=0.22", "ordered-set>=4.1", "imageio>=2.34"]
dev = ["pytest>=8", "hypothesis>=6", "pytest-timeout>=2", "pytest-cov>=5", "pyflakes>=3", "yt-dlp>=2025.1.1"]

[project.scripts]
pyplayer = "pyplayer.__main__:main"

[project.gui-scripts]
pyplayer-gui = "pyplayer.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "pyplayer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyplayer = ["resources/*.ttf", "resources/icons/*.png", "resources/icons/*/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: tests longs (lecture réelle, stress)"]

[tool.coverage.run]
source = ["pyplayer"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
