name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # passe « approfondie » chaque nuit

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        audio: ["device", "none"]      # la suite doit passer avec ET sans périphérique audio
    env:
      QT_QPA_PLATFORM: offscreen
      PYPLAYER_THOROUGH: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bibliothèques système (Qt hors écran + FFmpeg pour les médias de test)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 libxcb-cursor0 pulseaudio
      - name: Périphérique audio virtuel (PulseAudio + null sink)
        if: matrix.audio == 'device'
        run: |
          printf 'load-module module-null-sink sink_name=virtual_out\nload-module module-native-protocol-unix auth-anonymous=1 socket=/tmp/pulse-socket\n' > /tmp/pulse.pa
          sudo pulseaudio --system -n -F /tmp/pulse.pa --disallow-exit --exit-idle-time=-1 -D
          sleep 2
          echo "PULSE_SERVER=unix:/tmp/pulse-socket" >> "$GITHUB_ENV"
      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Analyse statique (pyflakes)
        run: python -m pyflakes src
      - name: Tests
        run: pytest -p no:logging --timeout=180 --cov=pyplayer --cov-report=term-missing:skip-covered --cov-fail-under=80
