name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # passe « approfondie » chaque nuit

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYPLAYER_THOROUGH: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bibliothèques système (Qt hors écran + FFmpeg pour les médias de test)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 libxcb-cursor0
      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Analyse statique (pyflakes)
        run: python -m pyflakes src
      - name: Tests
        run: pytest -p no:logging --timeout=180 --cov=pyplayer --cov-report=term-missing:skip-covered --cov-fail-under=80
