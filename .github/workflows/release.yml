name: release

# Pousser un tag « v0.2.0 » construit les binaires Linux et Windows (Nuitka, un seul fichier) et publie une release.
# Lancement manuel possible (« Run workflow ») : construit et garde les binaires en artefacts, sans publier.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Le tag doit correspondre à pyplayer.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^__version__ *= *"\(.*\)"/\1/p' src/pyplayer/__init__.py)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} ≠ version $version"; exit 1; }

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # glibc ancienne : le binaire tourne aussi sur les distributions plus récentes
            label: linux
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliothèques système (Linux)
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg patchelf libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 libxcb-cursor0
      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"
      - name: Tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -p no:logging --timeout=180 -q -rfE --tb=short 2>&1 | tee pytest-output.txt; exit "${PIPESTATUS[0]}"
      - name: Résumé des échecs (annotations lisibles dans l'interface et l'API)
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " pytest-output.txt | head -30 | while read -r line; do
            echo "::error title=test en échec::${line:0:400}"
          done
          tail -5 pytest-output.txt | while read -r line; do echo "::notice title=fin de pytest::${line:0:300}"; done
      - name: Compilation Nuitka
        shell: bash
        run: python tools/build_nuitka.py 2>&1 | tee nuitka-output.txt; exit "${PIPESTATUS[0]}"
      - name: Résumé de l'échec de compilation (annotations)
        if: failure()
        shell: bash
        run: |
          grep -iE "fatal|error|not found|failed|cannot|unable" nuitka-output.txt | head -15 | while read -r line; do
            echo "::error title=Nuitka::${line:0:450}"
          done
          tail -6 nuitka-output.txt | while read -r line; do echo "::notice title=fin de Nuitka::${line:0:300}"; done
      - name: Test de fumée du binaire
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          binary=$(ls dist/pyplayer-*)
          echo "binaire : $binary"
          "./$binary" --version
          # La ligne de commande doit fonctionner dans le binaire compilé (et afficher sa sortie).
          status_output=$("./$binary" tools status 2>&1) || true
          echo "$status_output"
          echo "$status_output" | grep -q "yt-dlp" || { echo "::error title=CLI::« tools status » n'affiche rien"; exit 1; }
          help_output=$("./$binary" download --help 2>&1) || true
          echo "$help_output" | head -5
          echo "$help_output" | grep -q -- "--playlist" || { echo "::error title=CLI::« download --help » n'affiche rien"; exit 1; }
          code=0; "./$binary" download > /dev/null 2>&1 || code=$?
          test "$code" = "2" || { echo "::error title=CLI::code de sortie attendu 2 sans lien, obtenu $code"; exit 1; }
      - name: Installateur Windows (Inno Setup)
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path src/pyplayer/__init__.py -Pattern '^__version__ = "(.*)"').Matches[0].Groups[1].Value
          $exe = (Get-ChildItem dist -Filter "pyplayer-*.exe" | Select-Object -First 1).FullName
          $out = & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DExeSource=$exe" packaging\pyplayer.iss 2>&1
          $code = $LASTEXITCODE
          $out | Select-Object -Last 15 | ForEach-Object { if ($code -ne 0) { Write-Host "::error title=Inno Setup::$_" } else { Write-Host $_ } }
          exit $code
      - name: Test d'installation et de désinstallation silencieuses
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist -Filter "*-setup.exe" | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP "pp-install"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error title=Installation::code $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path "$dir\PyPlayer.exe")) { Write-Host "::error title=Installation::PyPlayer.exe absent"; exit 1 }
          if (-not (Test-Path "HKCU:\Software\Classes\PyPlayer.media\shell\open\command")) { Write-Host "::error title=Installation::association Ouvrir avec absente"; exit 1 }
          if (-not (Test-Path "HKCU:\Software\Classes\.mp4\OpenWithProgids")) { Write-Host "::error title=Installation::.mp4 non déclaré"; exit 1 }
          $r = Start-Process -FilePath "$dir\PyPlayer.exe" -ArgumentList "--version" -Wait -PassThru
          if ($r.ExitCode -ne 0) { Write-Host "::error title=Binaire installé::code $($r.ExitCode)"; exit 1 }
          # Ligne de commande : le dossier « bin » est dans le PATH utilisateur et le script est là
          if (-not (Test-Path "$dir\bin\pyplayer.cmd")) { Write-Host "::error title=PATH::pyplayer.cmd absent"; exit 1 }
          $userPath = (Get-ItemProperty "HKCU:\Environment").Path
          if (($userPath -split ';') -notcontains "$dir\bin") { Write-Host "::error title=PATH::le dossier bin n'est pas dans le PATH ($userPath)"; exit 1 }
          # Le programme installé répond bien aux commandes du terminal (sortie redirigée vers un fichier)
          $outFile = Join-Path $env:RUNNER_TEMP "cli-out.txt"
          $c = Start-Process -FilePath "$dir\PyPlayer.exe" -ArgumentList "tools","status" -Wait -PassThru -RedirectStandardOutput $outFile
          $cliText = Get-Content $outFile -Raw
          Write-Host $cliText
          if ($cliText -notmatch "yt-dlp") { Write-Host "::error title=Ligne de commande::pas de sortie pour « tools status »"; exit 1 }
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\PyPlayer.exe") { Write-Host "::error title=Désinstallation::PyPlayer.exe toujours présent"; exit 1 }
          if (Test-Path "HKCU:\Software\Classes\PyPlayer.media") { Write-Host "::error title=Désinstallation::clé de registre restante"; exit 1 }
          $afterPath = (Get-ItemProperty "HKCU:\Environment").Path
          if (($afterPath -split ';') -contains "$dir\bin") { Write-Host "::error title=Désinstallation::le PATH contient encore le dossier bin"; exit 1 }
          Write-Host "installation, lancement et désinstallation OK"
      - name: Somme de contrôle
        shell: bash
        run: |
          cd dist
          sha256sum pyplayer-* > "SHA256SUMS-${{ matrix.label }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pyplayer-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Extraire les notes de version du CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          test -s notes.md || echo "PyPlayer ${GITHUB_REF_NAME}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
