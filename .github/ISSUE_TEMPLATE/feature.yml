    id: need
    attributes:
      label: Le besoin
      description: Quel problème voulez-vous résoudre ?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: L'idée
      description: Comment cela pourrait fonctionner (sans changer le look général de l'interface).
